/* ============================================================
   Colibri Design System — Colors & Typography
   Source: Pixel-sampled from Colibri_Logo_COLOR.png
   Font substitution: Nunito (wordmark), DM Sans (UI)
   ============================================================ */


:root {

  /* ── Brand Colors ─────────────────────────────────────────── */
  --color-brand:          #d60436;   /* Colibri Red — primary brand */
  --color-brand-dark:     #a8002a;   /* Hover / pressed */
  --color-brand-darker:   #7a001f;   /* Active / deep */
  --color-brand-light:    #ff3358;   /* Lighter variant */
  --color-brand-subtle:   #fff0f3;   /* Very light tint — bg accent */
  --color-brand-on:       #ffffff;   /* Text on brand bg */

  /* ── Neutrals ─────────────────────────────────────────────── */
  --color-neutral-900:    #292929;   /* Primary text / charcoal */
  --color-neutral-800:    #3d3d3d;
  --color-neutral-700:    #555555;   /* Secondary text */
  --color-neutral-600:    #6e6e6e;
  --color-neutral-500:    #888888;   /* Placeholder / muted */
  --color-neutral-400:    #a3a3a3;
  --color-neutral-300:    #c4c4c4;   /* Borders, dividers */
  --color-neutral-200:    #e0e0e0;   /* Light borders */
  --color-neutral-100:    #f0f0f0;   /* Hover bg */
  --color-neutral-50:     #f9f9f9;   /* Page bg */
  --color-white:          #ffffff;

  /* ── Semantic ─────────────────────────────────────────────── */
  --color-success:        #1a9e5c;
  --color-success-bg:     #edfbf4;
  --color-warning:        #e8860a;
  --color-warning-bg:     #fff8ec;
  --color-error:          #d60436;
  --color-error-bg:       #fff0f3;
  --color-info:           #0a6ed1;
  --color-info-bg:        #eef5ff;

  /* ── Background / Surface ─────────────────────────────────── */
  --color-bg:             #ffffff;
  --color-bg-subtle:      #f9f9f9;
  --color-bg-raised:      #ffffff;
  --color-border:         #e8e8e8;
  --color-border-strong:  #c4c4c4;

  /* ── Text ─────────────────────────────────────────────────── */
  --color-text-primary:   #292929;
  --color-text-secondary: #555555;
  --color-text-muted:     #888888;
  --color-text-disabled:  #a3a3a3;
  --color-text-inverse:   #ffffff;
  --color-text-brand:     #d60436;
  --color-text-link:      #d60436;

  /* ── Typography — Font Families ──────────────────────────── */
  --font-display:   'Nunito', system-ui, sans-serif;   /* Wordmark / hero headings */
  --font-body:      'DM Sans', system-ui, sans-serif;  /* UI, body text */
  --font-mono:      'JetBrains Mono', monospace;       /* Code, data */

  /* ── Typography — Scale ─────────────────────────────────── */
  --text-xs:    12px;
  --text-sm:    14px;
  --text-base:  16px;
  --text-md:    18px;
  --text-lg:    20px;
  --text-xl:    24px;
  --text-2xl:   32px;
  --text-3xl:   40px;
  --text-4xl:   56px;

  /* ── Typography — Weights ─────────────────────────────────── */
  --fw-regular:   400;
  --fw-medium:    500;
  --fw-semibold:  600;
  --fw-bold:      700;
  --fw-extrabold: 800;

  /* ── Typography — Line Heights ─────────────────────────────── */
  --lh-tight:   1.2;
  --lh-snug:    1.35;
  --lh-normal:  1.5;
  --lh-relaxed: 1.7;

  /* ── Typography — Semantic roles ─────────────────────────── */
  --type-display-font:   var(--font-display);
  --type-display-size:   var(--text-4xl);
  --type-display-weight: var(--fw-bold);
  --type-display-lh:     var(--lh-tight);

  --type-h1-font:   var(--font-display);
  --type-h1-size:   var(--text-3xl);
  --type-h1-weight: var(--fw-bold);
  --type-h1-lh:     var(--lh-tight);

  --type-h2-font:   var(--font-display);
  --type-h2-size:   var(--text-2xl);
  --type-h2-weight: var(--fw-semibold);
  --type-h2-lh:     var(--lh-snug);

  --type-h3-font:   var(--font-body);
  --type-h3-size:   var(--text-xl);
  --type-h3-weight: var(--fw-semibold);
  --type-h3-lh:     var(--lh-snug);

  --type-h4-font:   var(--font-body);
  --type-h4-size:   var(--text-lg);
  --type-h4-weight: var(--fw-medium);
  --type-h4-lh:     var(--lh-snug);

  --type-body-font:   var(--font-body);
  --type-body-size:   var(--text-base);
  --type-body-weight: var(--fw-regular);
  --type-body-lh:     var(--lh-normal);

  --type-small-font:   var(--font-body);
  --type-small-size:   var(--text-sm);
  --type-small-weight: var(--fw-regular);
  --type-small-lh:     var(--lh-normal);

  --type-label-font:   var(--font-body);
  --type-label-size:   var(--text-sm);
  --type-label-weight: var(--fw-medium);
  --type-label-lh:     1.2;

  --type-caption-font:   var(--font-body);
  --type-caption-size:   var(--text-xs);
  --type-caption-weight: var(--fw-regular);
  --type-caption-lh:     var(--lh-normal);

  --type-code-font:   var(--font-mono);
  --type-code-size:   var(--text-sm);
  --type-code-weight: var(--fw-regular);
  --type-code-lh:     var(--lh-relaxed);

  /* ── Spacing ─────────────────────────────────────────────── */
  --space-1:    4px;
  --space-2:    8px;
  --space-3:    12px;
  --space-4:    16px;
  --space-5:    20px;
  --space-6:    24px;
  --space-8:    32px;
  --space-10:   40px;
  --space-12:   48px;
  --space-16:   64px;
  --space-24:   96px;

  /* ── Corner Radii ─────────────────────────────────────────── */
  --radius-sm:   4px;
  --radius-md:   8px;
  --radius-lg:   12px;
  --radius-xl:   20px;
  --radius-full: 9999px;

  /* ── Shadows ─────────────────────────────────────────────── */
  --shadow-sm:  0 1px 3px rgba(0,0,0,.10), 0 1px 2px rgba(0,0,0,.06);
  --shadow-md:  0 4px 16px rgba(0,0,0,.10), 0 2px 4px rgba(0,0,0,.06);
  --shadow-lg:  0 8px 32px rgba(0,0,0,.12), 0 4px 8px rgba(0,0,0,.06);
  --shadow-xl:  0 16px 48px rgba(0,0,0,.14);
  --shadow-brand: 0 4px 16px rgba(214,4,54,.25);

  /* ── Transitions ─────────────────────────────────────────── */
  --ease-standard: cubic-bezier(0.4, 0, 0.2, 1);
  --duration-fast:   150ms;
  --duration-normal: 250ms;
  --duration-slow:   400ms;
  --transition-base: var(--duration-fast) var(--ease-standard);
}

/* ── Semantic element defaults ─────────────────────────────── */
body {
  font-family: var(--font-body);
  font-size: var(--text-base);
  color: var(--color-text-primary);
  background: var(--color-bg);
  line-height: var(--lh-normal);
  -webkit-font-smoothing: antialiased;
}

h1 { font-family: var(--type-h1-font); font-size: var(--type-h1-size); font-weight: var(--type-h1-weight); line-height: var(--type-h1-lh); }
h2 { font-family: var(--type-h2-font); font-size: var(--type-h2-size); font-weight: var(--type-h2-weight); line-height: var(--type-h2-lh); }
h3 { font-family: var(--type-h3-font); font-size: var(--type-h3-size); font-weight: var(--type-h3-weight); line-height: var(--type-h3-lh); }
h4 { font-family: var(--type-h4-font); font-size: var(--type-h4-size); font-weight: var(--type-h4-weight); line-height: var(--type-h4-lh); }
p  { font-family: var(--type-body-font); font-size: var(--type-body-size); line-height: var(--type-body-lh); }
small { font-size: var(--text-sm); color: var(--color-text-muted); }
code, pre { font-family: var(--font-mono); font-size: var(--type-code-size); }
a { color: var(--color-text-link); text-decoration: none; }
a:hover { text-decoration: underline; }

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
#root { height: 100%; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #d0d0d0; border-radius: 3px; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
@keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
@keyframes shake {
  0%,100% { transform: translateX(0); }
  10%,50%,90% { transform: translateX(-4px); }
  30%,70% { transform: translateX(4px); }
}
  </style>

  <script type="text/babel" data-presets="react">
// PAREA LMS — Shared Components
// Exports to window for use in main app

const { useState, useEffect, useRef } = React;

// ── Design Tokens ─────────────────────────────────────────────
const C = {
  brand: '#d60436',
  brandDark: '#a8002a',
  brandSubtle: '#fff0f3',
  charcoal: '#292929',
  text2: '#555',
  text3: '#888',
  border: '#e8e8e8',
  bg: '#f4f5f7',
  white: '#ffffff',
  success: '#1a9e5c',
  successBg: '#edfbf4',
  warning: '#e8860a',
  warningBg: '#fff8ec',
  info: '#0a6ed1',
  infoBg: '#eef5ff',
  sidebar: '#1e2333',
  sidebarHover: '#2a3047',
  sidebarActive: '#d60436',
  sidebarText: '#b0b8cc',
  sidebarTextActive: '#ffffff'
};

// ── Icon ─────────────────────────────────────────────────────
function Icon({ name, size = 16, color = 'currentColor', strokeWidth = 1.75 }) {
  const ref = useRef(null);
  useEffect(() => {
    if (ref.current) {
      ref.current.innerHTML = '';
      const el = document.createElement('i');
      el.setAttribute('data-lucide', name);
      ref.current.appendChild(el);
      lucide.createIcons({ nodes: [el] });
      const svg = ref.current.querySelector('svg');
      if (svg) {
        svg.setAttribute('width', size);
        svg.setAttribute('height', size);
        svg.setAttribute('stroke', color);
        svg.setAttribute('stroke-width', strokeWidth);
      }
    }
  }, [name, size, color, strokeWidth]);
  return <span ref={ref} style={{ display: 'inline-flex', alignItems: 'center', lineHeight: 0 }} />;
}

// ── Button ───────────────────────────────────────────────────
function Button({ children, variant = 'primary', size = 'md', onClick, disabled, style, fullWidth }) {
  const [hov, setHov] = useState(false);
  const base = {
    display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 7,
    fontFamily: 'inherit', fontWeight: 600, cursor: disabled ? 'not-allowed' : 'pointer',
    border: 'none', borderRadius: 8, transition: 'all 150ms ease',
    fontSize: size === 'sm' ? 13 : size === 'lg' ? 15 : 14,
    padding: size === 'sm' ? '7px 14px' : size === 'lg' ? '13px 28px' : '10px 20px',
    width: fullWidth ? '100%' : undefined
  };
  const variants = {
    primary: { background: hov ? C.brandDark : C.brand, color: '#fff' },
    secondary: { background: hov ? '#ffd6de' : C.brandSubtle, color: C.brand },
    ghost: { background: hov ? '#f0f0f0' : 'transparent', color: C.charcoal, border: `1px solid ${C.border}` },
    outline: { background: 'transparent', color: C.brand, border: `1.5px solid ${C.brand}`, ...(hov ? { background: C.brandSubtle } : {}) },
    success: { background: hov ? '#148a4e' : C.success, color: '#fff' },
    dark: { background: hov ? '#3d3d3d' : C.charcoal, color: '#fff' }
  };
  const disabledStyle = disabled ? { background: '#e0e0e0', color: '#a3a3a3', border: 'none' } : {};
  return (
    <button
      onClick={disabled ? undefined : onClick}
      onMouseEnter={() => setHov(true)}
      onMouseLeave={() => setHov(false)}
      style={{ ...base, ...variants[variant], ...disabledStyle, ...style }} data-comment-anchor="87db3dd52b-button-73-5">
      
      {children}
    </button>);

}

// ── Badge ────────────────────────────────────────────────────
function Badge({ children, color = 'neutral', dot = true }) {
  const map = {
    brand: { bg: C.brandSubtle, text: C.brand, d: C.brand },
    success: { bg: C.successBg, text: C.success, d: C.success },
    warning: { bg: C.warningBg, text: C.warning, d: C.warning },
    info: { bg: C.infoBg, text: C.info, d: C.info },
    neutral: { bg: '#f0f0f0', text: C.text2, d: '#888' }
  };
  const s = map[color] || map.neutral;
  return (
    <span style={{
      display: 'inline-flex', alignItems: 'center', gap: dot ? 5 : 0,
      background: s.bg, color: s.text,
      padding: '3px 10px', borderRadius: 9999,
      fontSize: 11, fontWeight: 600, letterSpacing: '.02em'
    }}>
      {dot && <span style={{ width: 6, height: 6, borderRadius: '50%', background: s.d, flexShrink: 0 }} />}
      {children}
    </span>);

}

// ── Avatar ───────────────────────────────────────────────────
function Avatar({ name = '?', size = 32 }) {
  const initials = name.split(' ').map((w) => w[0]).join('').slice(0, 2).toUpperCase();
  const hue = name.charCodeAt(0) * 17 % 360;
  return (
    <div style={{
      width: size, height: size, borderRadius: '50%',
      background: `hsl(${hue},55%,85%)`, color: `hsl(${hue},50%,30%)`,
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      fontWeight: 700, fontSize: size * 0.36, flexShrink: 0, letterSpacing: '-0.02em'
    }}>{initials}</div>);

}

// ── Card ─────────────────────────────────────────────────────
function Card({ children, style, padding = '20px 22px' }) {
  return (
    <div style={{
      background: C.white, borderRadius: 12,
      boxShadow: '0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04)',
      padding, ...style
    }}>
      {children}
    </div>);

}

// ── CardSection ──────────────────────────────────────────────
function CardSection({ title, children, style }) {
  return (
    <Card style={style}>
      {title &&
      <div style={{ fontSize: 14, fontWeight: 700, color: C.charcoal, marginBottom: 14, letterSpacing: '-.01em' }}>
          {title}
        </div>
      }
      {children}
    </Card>);

}

// ── Step Progress Tracker ────────────────────────────────────
function StepTracker({ steps, current }) {
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 0, marginBottom: 4 }}>
      {steps.map((s, i) => {
        const done = i < current;
        const active = i === current;
        return (
          <React.Fragment key={i}>
            <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4 }}>
              <div style={{
                width: 28, height: 28, borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center',
                background: done ? C.success : active ? C.brand : C.white,
                border: done ? `2px solid ${C.success}` : active ? `2px solid ${C.brand}` : `2px solid #ccc`,
                color: done || active ? '#fff' : '#999',
                fontSize: 11, fontWeight: 700, flexShrink: 0, transition: 'all 250ms'
              }}>
                {done ? <Icon name="check" size={13} color="#fff" strokeWidth={2.5} /> : i + 1}
              </div>
            </div>
            {i < steps.length - 1 &&
            <div style={{
              flex: 1, height: 2, minWidth: 20,
              background: done ? C.success : '#e0e0e0',
              transition: 'background 250ms'
            }} />
            }
          </React.Fragment>);

      })}
    </div>);

}

// ── Checkbox Item ────────────────────────────────────────────
function CheckItem({ label, checked, onChange }) {
  return (
    <label style={{ display: 'flex', alignItems: 'flex-start', gap: 10, cursor: 'pointer', userSelect: 'none', padding: '4px 0' }}>
      <div
        onClick={() => onChange(!checked)}
        style={{
          width: 18, height: 18, borderRadius: 4, border: `2px solid ${checked ? C.success : '#ccc'}`,
          background: checked ? C.success : 'transparent',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          flexShrink: 0, marginTop: 1, cursor: 'pointer', transition: 'all 150ms'
        }}>
        
        {checked && <Icon name="check" size={11} color="#fff" strokeWidth={3} />}
      </div>
      <span style={{ fontSize: 14, color: checked ? C.text3 : C.charcoal, textDecoration: checked ? 'line-through' : 'none', lineHeight: 1.4 }}>
        {label}
      </span>
    </label>);

}

// ── Textarea ─────────────────────────────────────────────────
function Textarea({ placeholder, value, onChange, rows = 4 }) {
  return (
    <textarea
      rows={rows}
      placeholder={placeholder}
      value={value}
      onChange={(e) => onChange(e.target.value)}
      style={{
        width: '100%', fontFamily: 'inherit', fontSize: 14, color: C.charcoal,
        border: `1px solid ${C.border}`, borderRadius: 8,
        padding: '10px 12px', outline: 'none', resize: 'vertical',
        lineHeight: 1.5, background: '#fafafa'
      }}
      onFocus={(e) => {e.target.style.borderColor = C.brand;e.target.style.boxShadow = '0 0 0 3px rgba(214,4,54,.08)';}}

function ProgressRing({ value = 0, size = 100, stroke = 8, color = '#d60436', track = '#f0f0f0', label, sub }) {

  return (

      <svg width={size} height={size} style={{ transform: 'rotate(-90deg)' }}>
        <circle cx={size / 2} cy={size / 2} r={r} stroke={track} strokeWidth={stroke} fill="none" />

// ── Sparkline ────────────────────────────────────────────────
function Sparkline({ data, w = 220, h = 50, color = '#d60436', fill = 'rgba(214,4,54,0.10)' }) {
  if (!data || !data.length) return null;
  const min = Math.min(...data),max = Math.max(...data);
  const range = max - min || 1;
  const pts = data.map((v, i) => {
    const x = i / (data.length - 1) * (w - 4) + 2;
    const y = h - 4 - (v - min) / range * (h - 8);
    return [x, y];
  });
  const path = pts.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p[0]} ${p[1]}`).join(' ');
  const area = `${path} L ${pts[pts.length - 1][0]} ${h} L ${pts[0][0]} ${h} Z`;
  return (
    <svg width={w} height={h} style={{ display: 'block' }}>
      <path d={area} fill={fill} />
      <path d={path} stroke={color} strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round" />
      {pts.map((p, i) => i === pts.length - 1 &&
      <circle key={i} cx={p[0]} cy={p[1]} r="3.5" fill={color} stroke="#fff" strokeWidth="1.5" />
      )}
    </svg>);

}

// ── BarMini ──────────────────────────────────────────────────
function BarMini({ data, w = 220, h = 60, color = '#d60436' }) {
  const max = Math.max(...data) || 1;
  const bw = (w - (data.length - 1) * 4) / data.length;
  return (
    <svg width={w} height={h}>
      {data.map((v, i) => {
        const bh = v / max * (h - 4);
        return <rect key={i} x={i * (bw + 4)} y={h - bh} width={bw} height={bh} rx="2" fill={color} opacity={0.4 + i / data.length * 0.6} />;
      })}
    </svg>);

}

// ── Compression Curve (the AI-first "speed" graph) ───────────
function CompressionCurve({ height = 120, width = 360 }) {
  // Time per assignment over 24 sessions — declining curve
  const data = [148, 142, 138, 130, 126, 122, 115, 110, 108, 102, 98, 94, 88, 84, 80, 76, 73, 70, 68, 66, 63, 61, 59, 57];
  const pad = { l: 32, r: 12, t: 12, b: 22 };
  const w = width - pad.l - pad.r,h = height - pad.t - pad.b;
  const max = 160,min = 40;
  const x = (i) => pad.l + i / (data.length - 1) * w;
  const y = (v) => pad.t + h - (v - min) / (max - min) * h;
  const path = data.map((v, i) => `${i === 0 ? 'M' : 'L'} ${x(i)} ${y(v)}`).join(' ');
  const area = `${path} L ${x(data.length - 1)} ${pad.t + h} L ${x(0)} ${pad.t + h} Z`;
  const gridY = [40, 80, 120, 160];

  return (
    <svg width={width} height={height} style={{ display: 'block' }}>
      <defs>
        <linearGradient id="ccGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#d60436" stopOpacity="0.22" />
          <stop offset="100%" stopColor="#d60436" stopOpacity="0" />
        </linearGradient>
      </defs>
      {gridY.map((g) =>
      <g key={g}>
          <line x1={pad.l} y1={y(g)} x2={pad.l + w} y2={y(g)} stroke="#f0f0f0" />
          <text x={pad.l - 6} y={y(g) + 3} fontSize="9" fill="#888" textAnchor="end" fontFamily="DM Sans">{g}m</text>
        </g>
      )}
      <path d={area} fill="url(#ccGrad)" />
      <path d={path} stroke="#d60436" strokeWidth="2" fill="none" strokeLinecap="round" />
      {data.map((v, i) => i % 4 === 0 && <circle key={i} cx={x(i)} cy={y(v)} r="2.5" fill="#d60436" />)}
      <circle cx={x(data.length - 1)} cy={y(data[data.length - 1])} r="4.5" fill="#d60436" stroke="#fff" strokeWidth="2" />
      <text x={pad.l} y={height - 4} fontSize="9" fill="#888" fontFamily="DM Sans">Session 1</text>
      <text x={pad.l + w} y={height - 4} fontSize="9" fill="#888" textAnchor="end" fontFamily="DM Sans">Session 24</text>
    </svg>);

function USPAPScanner({ items, strictness = 'normal' }) {
  // items: [{ code, label, status: 'ok' | 'warn' | 'fail' | 'pending' }]
  const map = {
    ok: { color: '#1a9e5c', bg: '#edfbf4', icon: 'check', label: 'Resolved' },
    warn: { color: '#e8860a', bg: '#fff8ec', icon: 'alert-triangle', label: 'Pending' },

    pending: { color: '#888', bg: '#f0f0f0', icon: 'clock', label: 'Later' }
  };

    <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 6 }}>

        const m = map[it.status] || map.pending;
        return (
          <div key={i} style={{
            display: 'flex', alignItems: 'center', gap: 10,

// ═══════════════════════════════════════════════════════════
// Workfile store — localStorage-backed, scoped per report
// ═══════════════════════════════════════════════════════════
const WORKFILE_KEY = 'parea_workfile_v1';
function loadWorkfile() {
  try {
    const raw = localStorage.getItem(WORKFILE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  // Seed with a few entries so the dashboard card isn't empty on first load
  return {
    'report-1': [
    { id: 'wf-seed-1', step: 'p1', label: 'Engagement letter draft', source: 'True Footage', kind: 'document', ts: Date.now() - 2 * 86400000 },
    { id: 'wf-seed-2', step: 'p1', label: 'PropMix subject property card', source: 'PropMix', kind: 'screenshot', ts: Date.now() - 86400000 },
    { id: 'wf-seed-3', step: 'p2', label: 'Apex sketch · subject GLA reconciled', source: 'Apex Sketch', kind: 'screenshot', ts: Date.now() - 12 * 3600000 }],

    'report-2': [],
    'report-3': []
  };
}
function saveWorkfile(wf) {
  try {localStorage.setItem(WORKFILE_KEY, JSON.stringify(wf));} catch (e) {}
  // Broadcast change
  window.dispatchEvent(new CustomEvent('parea-workfile-changed'));
}
function addToWorkfile(report, entry) {
  const wf = loadWorkfile();
  if (!wf[report]) wf[report] = [];
  wf[report].unshift({ id: 'wf-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8), ts: Date.now(), ...entry });
  saveWorkfile(wf);
}

function useWorkfile(report = 'report-1') {
  const [wf, setWf] = useSA(loadWorkfile);
  useEA(() => {
    const handler = () => setWf(loadWorkfile());
    window.addEventListener('parea-workfile-changed', handler);
    return () => window.removeEventListener('parea-workfile-changed', handler);
  }, []);
  return wf[report] || [];
}

function relTime(ts) {
  const diff = Date.now() - ts;
  if (diff < 60_000) return 'just now';
  if (diff < 3_600_000) return Math.floor(diff / 60_000) + 'm ago';
  if (diff < 86_400_000) return Math.floor(diff / 3_600_000) + 'h ago';
  return Math.floor(diff / 86_400_000) + 'd ago';
}

function StaticUSPAPChecklist({ title = 'USPAP self-check', items = STATIC_USPAP_CHECKLIST, printable = true }) {
  const [checked, setChecked] = useSA({});
  const toggle = (code) => setChecked((c) => ({ ...c, [code]: !c[code] }));
  return (
    <Card padding={0}>
      <div style={{
        padding: '14px 20px', borderBottom: '1px solid #eee',
        display: 'flex', alignItems: 'center', gap: 12
      }}>
        <div style={{
          width: 32, height: 32, borderRadius: 7, flexShrink: 0,
          background: '#f4f5f7',
          display: 'flex', alignItems: 'center', justifyContent: 'center'
        }}>
          <Icon name="list-checks" size={16} color="#292929" />
        </div>
        <div style={{ flex: 1 }}>
          <div style={{ fontSize: 13.5, fontWeight: 800, fontFamily: "'Nunito', sans-serif" }}>{title}</div>
          <div style={{ fontSize: 11, color: '#888', marginTop: 1 }}>Static self-check · you mark each item · not auto-graded · not AI-completed</div>
        </div>
        {printable &&
        <Button variant="outline" size="sm" onClick={() => window.print()}>
            <Icon name="printer" size={12} color="#d60436" /> Print
          </Button>
        }
      </div>
      <div style={{ padding: '10px 8px' }}>
        {items.map((it, i) => {
          const isChecked = !!checked[it.code];
          return (
            <button key={it.code} onClick={() => toggle(it.code)} style={{
              width: '100%', display: 'flex', gap: 12, alignItems: 'flex-start',
              padding: '10px 14px', background: 'none', border: 'none', cursor: 'pointer',
              fontFamily: 'inherit', textAlign: 'left',
              borderRadius: 6,
              transition: 'background 120ms'
            }}
            onMouseEnter={(e) => e.currentTarget.style.background = '#fafbfc'}
            onMouseLeave={(e) => e.currentTarget.style.background = 'none'}>
              
              <div style={{
                width: 20, height: 20, borderRadius: 4, flexShrink: 0,
                background: isChecked ? '#292929' : '#fff',
                border: `1.5px solid ${isChecked ? '#292929' : '#c8c8c8'}`,
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                marginTop: 2
              }}>
                {isChecked && <Icon name="check" size={12} color="#fff" strokeWidth={3} />}
              </div>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 11, fontFamily: "'JetBrains Mono', monospace", color: '#888', fontWeight: 700 }}>{it.code}</div>
                <div style={{ fontSize: 13, color: '#292929', marginTop: 1, lineHeight: 1.45,
                  textDecoration: isChecked ? 'line-through' : 'none',
                  opacity: isChecked ? 0.6 : 1
                }}>{it.label}</div>
              </div>
            </button>);

        })}
      </div>
      <div style={{
        padding: '10px 20px', background: '#fafbfc', borderTop: '1px solid #eee',
        display: 'flex', alignItems: 'center', gap: 10,
        fontSize: 11, color: '#666'
      }}>
        <Icon name="info" size={12} color="#888" />
        Marks are yours alone — not transmitted, not auto-graded. The checklist is a thinking aid, not a compliance certificate.
      </div>
    </Card>);

}

function CompetencyRadar() {
  const skills = [
  { label: 'Sales Comp.', val: 0.78 },
  { label: 'Market & HBU', val: 0.85 },
  { label: 'USPAP Std 1', val: 0.72 },
  { label: 'USPAP Std 2', val: 0.45 },
  { label: 'Cost', val: 0.60 },
  { label: 'Income', val: 0.55 },
  { label: 'Report Writing', val: 0.40 },
  { label: 'Comm. of Results', val: 0.35 }];

  const cx = 130,cy = 110,r = 78;
  const angle = (i) => i / skills.length * Math.PI * 2 - Math.PI / 2;
  const pt = (i, v) => [cx + Math.cos(angle(i)) * r * v, cy + Math.sin(angle(i)) * r * v];
  const polygon = skills.map((s, i) => pt(i, s.val).join(',')).join(' ');
  const cohortAvg = skills.map((s, i) => pt(i, 0.55).join(',')).join(' ');

  return (
    <div style={{ display: 'flex', justifyContent: 'center' }}>
      <svg width="260" height="220">
        {[0.25, 0.5, 0.75, 1].map((g) =>
        <polygon key={g}
        points={skills.map((s, i) => pt(i, g).join(',')).join(' ')}
        fill="none" stroke="#eee" strokeWidth="1" />
        )}
        {skills.map((s, i) => {
          const [x, y] = pt(i, 1);
          return <line key={'l' + i} x1={cx} y1={cy} x2={x} y2={y} stroke="#eee" strokeWidth="1" />;
        })}
        <polygon points={cohortAvg} fill="#88888822" stroke="#888" strokeWidth="1" strokeDasharray="3,3" />
        <polygon points={polygon} fill="#d6043622" stroke="#d60436" strokeWidth="2" />
        {skills.map((s, i) => {
          const [x, y] = pt(i, s.val);
          return <circle key={'c' + i} cx={x} cy={y} r="3" fill="#d60436" />;
        })}
        {skills.map((s, i) => {
          const [x, y] = pt(i, 1.18);
          return <text key={'t' + i} x={x} y={y} textAnchor="middle" fontSize="9" fill="#666" fontFamily="DM Sans" fontWeight="600">{s.label}</text>;
        })}
      </svg>
    </div>);

}

            </p>
            <p style={{ fontSize: 14, color: '#444', marginTop: 10, lineHeight: 1.6 }}>
              The independence requirement is what makes appraisers different from underwriters, agents, or AVMs. Lenders, agents, and borrowers all want a number. You owe them <em>credible analysis</em>, not their number.
            </p>
          </div>

// ─── SVG Avatar helper (replaces all pravatar.cc) ────────────────
function svgAvatar(name, size = 128) {
  const initials = name.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
  const hue = Array.from(name).reduce((h, c, i) => h + c.charCodeAt(0) * (i+1), 0) % 360;
  const bg = `hsl(${hue},45%,65%)`;
  const fg = `hsl(${hue},50%,18%)`;
  const svg = [
    `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">`,
    `<circle cx="${size/2}" cy="${size/2}" r="${size/2}" fill="${bg}"/>`,
    `<text x="${size/2}" y="${Math.round(size*0.65)}" text-anchor="middle" font-family="DM Sans,sans-serif" font-weight="700" font-size="${Math.round(size*0.38)}" fill="${fg}">${initials}</text>`,
    `</svg>`
  ].join('');
  return 'data:image/svg+xml,' + encodeURIComponent(svg);
}

function SocraticPanel({ open, onToggle, route }) {
  const [shaking, setShaking] = useState(false);
  const prevRoute = useRef(route);

  useEffect(() => {
    if (prevRoute.current !== route && AI_SCREENS.has(route)) {
      setShaking(true);
      const t = setTimeout(() => setShaking(false), 800);
      prevRoute.current = route;
      return () => clearTimeout(t);
    }
    prevRoute.current = route;
  }, [route]);

  const [messages, setMessages] = useState([
    { from: 'ai', text: 'Ready. Navigate to any assignment screen and I\'ll ask you a Socratic question to sharpen your thinking.' }
  ]);
  const [input, setInput] = useState('');

  const send = () => {
    if (!input.trim()) return;
    setMessages(m => [...m, { from: 'user', text: input }]);
    setInput('');
    setTimeout(() => {
      setMessages(m => [...m, { from: 'ai', text: 'That\'s a reasonable read. But push one level deeper — what market mechanism supports that conclusion? Cite a data point.' }]);
    }, 800);
  };

  return (
    <>

      <button onClick={onToggle}
        style={{

function S_AdjustmentGrid({ navigate }) {
  const [cells, setCells] = useState({
    'c1-location': '', 'c1-gla': '+4,500', 'c1-bsmt': '', 'c1-garage': '',
    'c2-location': '', 'c2-gla': '-4,500', 'c2-bsmt': '-8,000', 'c2-garage': '',
    'c3-location': '+5,000', 'c3-gla': '+6,900', 'c3-bsmt': '', 'c3-garage': '+3,000',
  });

  const comps = COMPS.slice(0,3);
  const rows = [
    { key: 'location', label: 'Location', hint: 'Same sub-market? Adjust for boundary quality.' },
    { key: 'gla', label: 'GLA', hint: '$X/sf derived from paired sales — show your work.' },
    { key: 'bsmt', label: 'Basement finish', hint: 'Finished basement is below-grade — separate line item.' },
    { key: 'garage', label: 'Garage', hint: 'Attached vs detached, stalls.' },
  ];

  const net = (id) => {
    const vals = rows.map(r => cells[`${id}-${r.key}`] || '0');
    return vals.reduce((s, v) => s + (parseInt(v.replace(/[,$]/g,'')) || 0), 0);
  };

  return (
    <div>
      <PageHeader breadcrumb={['Step 5', 'Section XIV']} title="Adjustment grid"
        subtitle="Build the sales comparison adjustment grid. Every line item needs a defensible derivation — no rule-of-thumb adjustments." />

      <div style={{ marginBottom: 14 }}>
        <TextbookCallout topic="adjustments" why="Net ≤15% · Gross ≤25% of unadjusted sale — FNMA guideline. Know this before you fill a single cell." />
      </div>

      <WorkfileCaptureButton step="p5" label="Adjustment grid · paired-sales derivation" source="PropMix + own analysis" />

      <Card padding={0} style={{ overflow: 'auto' }}>
        <table style={{ width: '100%', borderCollapse: 'collapse', fontFamily: "'DM Sans', sans-serif", fontSize: 12.5 }}>
          <thead>
            <tr style={{ background: '#1a1d2b', color: '#fff' }}>
              <th style={{ padding: '10px 14px', textAlign: 'left', fontWeight: 700, width: 160 }}>Item</th>
              <th style={{ padding: '10px 14px', textAlign: 'center', fontWeight: 700 }}>Subject</th>
              {comps.map(c => (
                <th key={c.id} style={{ padding: '10px 14px', textAlign: 'center', fontWeight: 700 }}>
                  <div>{c.id}</div>
                  <div style={{ fontSize: 10, opacity: 0.75 }}>${c.sale.toLocaleString()}</div>
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            <tr style={{ background: '#fafafa' }}>
              <td style={{ padding: '8px 14px', fontWeight: 700, color: '#888', fontSize: 11, textTransform: 'uppercase', letterSpacing: '.04em' }}>Sale Price</td>
              <td style={{ padding: '8px 14px', textAlign: 'center' }}>—</td>
              {comps.map(c => <td key={c.id} style={{ padding: '8px 14px', textAlign: 'center', fontWeight: 700 }}>${c.sale.toLocaleString()}</td>)}
            </tr>
            {rows.map((row, ri) => (
              <tr key={row.key} style={{ borderBottom: '1px solid #f0f0f0', background: ri % 2 === 0 ? '#fff' : '#fafbfc' }}>
                <td style={{ padding: '8px 14px' }}>
                  <div style={{ fontWeight: 600, color: '#292929' }}>{row.label}</div>
                  <div style={{ fontSize: 10.5, color: '#888', marginTop: 2 }}>{row.hint}</div>
                </td>
                <td style={{ padding: '8px 14px', textAlign: 'center', fontSize: 11, color: '#888' }}>
                  {row.key === 'gla' ? '2,148 sf' : row.key === 'bsmt' ? 'Finished' : row.key === 'garage' ? '2-car att.' : 'Glenmoor Est.'}
                </td>
                {comps.map(c => {
                  const cellKey = `${c.id.toLowerCase()}-${row.key}`;
                  const val = cells[cellKey] || '';
                  const num = parseInt(val.replace(/[,$+]/g,'')) || 0;
                  const color = num > 0 ? '#1a9e5c' : num < 0 ? '#d60436' : '#888';
                  return (
                    <td key={c.id} style={{ padding: '6px 10px', textAlign: 'center' }}>
                      <input
                        value={val}
                        onChange={e => setCells(prev => ({...prev, [cellKey]: e.target.value}))}
                        placeholder="+/−"
                        style={{
                          width: 90, padding: '6px 8px', textAlign: 'center',
                          border: `1.5px solid ${val ? '#e8e8e8' : '#f0f0f0'}`,
                          borderRadius: 5, fontFamily: "'JetBrains Mono', monospace",
                          fontSize: 12.5, color, background: val ? '#fff' : '#fafafa',
                          outline: 'none'
                        }}
                      />
                    </td>
                  );
                })}
              </tr>
            ))}
            <tr style={{ background: '#f4f5f7', fontWeight: 700 }}>
              <td style={{ padding: '10px 14px' }}>Net adjustment</td>
              <td style={{ padding: '10px 14px', textAlign: 'center' }}>—</td>
              {comps.map(c => {
                const n = net(c.id.toLowerCase());
                return <td key={c.id} style={{ padding: '10px 14px', textAlign: 'center', color: n > 0 ? '#1a9e5c' : n < 0 ? '#d60436' : '#888', fontFamily: "'JetBrains Mono', monospace" }}>{n > 0 ? '+' : ''}{n.toLocaleString()}</td>;
              })}
            </tr>
            <tr style={{ background: '#edfbf4', fontWeight: 800 }}>
              <td style={{ padding: '10px 14px' }}>Adjusted sale price</td>
              <td style={{ padding: '10px 14px', textAlign: 'center' }}>—</td>
              {comps.map(c => {

                return <td key={c.id} style={{ padding: '10px 14px', textAlign: 'center', fontSize: 14, fontFamily: "'Nunito', sans-serif", color: '#1a9e5c' }}>${adj.toLocaleString()}</td>;
              })}
            </tr>
          </tbody>
        </table>
      </Card>

      <div style={{ display: 'flex', justifyContent: 'flex-end', gap: 10, marginTop: 14 }}>
        <Button variant="ghost" onClick={() => navigate('mentor-review-4')}>Back</Button>
        <Button variant="primary" onClick={() => navigate('valuation')}>
          Continue · Value indication <Icon name="arrow-right" size={13} color="#fff" />
        </Button>
      </div>
    </div>
  );
}

        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 16, marginBottom: 24 }}>
          {[
            { label: 'Reports completed', value: '3', icon: 'file-text', color: '#d60436' },
            { label: 'Mentor reviews cleared', value: '24', icon: 'check-circle', color: '#1a9e5c' },
            { label: 'Total hours', value: '150+', icon: 'clock', color: '#0a6ed1' },
          ].map((s, i) => (
            <div key={i} style={{ textAlign: 'center', padding: 16, background: '#fafafa', borderRadius: 10 }}>
              <Icon name={s.icon} size={28} color={s.color} />
              <div style={{ fontSize: 28, fontWeight: 800, color: '#292929', fontFamily: "'Nunito', sans-serif", marginTop: 8 }}>{s.value}</div>
              <div style={{ fontSize: 12, color: '#888', marginTop: 2 }}>{s.label}</div>
            </div>
          ))}
        </div>
        <div style={{ background: '#f4f5f7', borderRadius: 10, padding: 18, marginBottom: 16, textAlign: 'center' }}>
          <Icon name="award" size={40} color="#d60436" />
          <h2 style={{ fontFamily: "'Nunito', sans-serif", fontSize: 22, fontWeight: 800, color: '#292929', marginTop: 10 }}>
            Certificate of Completion
          </h2>
          <p style={{ fontSize: 13, color: '#666', marginTop: 6 }}>Sarah H. has successfully completed the McKissock PAREA Licensed Residential Appraiser Practicum.</p>
        </div>
        <div style={{ display: 'flex', gap: 10, justifyContent: 'center' }}>
          <Button variant="primary" size="lg">
            <Icon name="download" size={15} color="#fff" /> Download certificate
          </Button>
          <Button variant="ghost" size="lg" onClick={() => navigate('home')}>
            Return to dashboard
          </Button>
        </div>
      </Card>
    </div>
  );
}

// ─── Route → Screen mapping ───────────────────────────────────────
function renderScreen(route, navigate, tweaks) {
  const p = { navigate, tweaks };
  switch (route) {
    case 'before-you-start': return <S00_BeforeYouStart {...p} />;
    case 'welcome': return <S01_Enrollment {...p} />;
    case 'tech-setup': return <S02_TechSetup {...p} />;
    case 'home': return <S03_Dashboard {...p} />;
    case 'phase-1-intro': return <S04_Phase1Intro {...p} />;
    case 'ethics-lesson': return <S05_Ethics {...p} />;
    case 'tool-orientation': return <S06_ToolOrientation {...p} />;
    case 'engagement-letter': return <S07_Engagement {...p} />;
    case 'preliminary-research': return <S08_PrelimResearch {...p} />;
    case 'inspection-scheduling': return <S09_InspectionScheduling {...p} />;
    case 'mentor-review-1': return <S10_MentorReview1 {...p} />;
    case 'phase-2-launch': return <S12_CaseDrop {...p} />;
    case 'property-research': return <S13_PropertyResearch {...p} />;
    case 'virtual-inspection': return <S14_VirtualInspection {...p} />;
    case 'gla-measurement': return <S15_GLA {...p} />;
    case 'sketch': return <S16_Sketch {...p} />;
    case 'mentor-review-2': return <S17_MentorReview2 {...p} />;
    case 'market-analysis': return <S18_Market {...p} />;
    case 'hbu': return <S19_HBU {...p} />;
    case 'mentor-review-3': return <S20_MentorReview3 {...p} />;
    case 'comp-selection': return <S21_CompSelection {...p} />;
    case 'mentor-review-4': return <S22_MentorReview4 {...p} />;
    case 'adjustment-grid': return <S_AdjustmentGrid {...p} />;
    case 'valuation': return <S_Valuation {...p} />;
    case 'mentor-review-5': return <S_MentorReviewStub n={5} step={5} prevRoute="valuation" nextRoute="reconciliation" {...p} />;
    case 'reconciliation': return <S_Reconciliation {...p} />;
    case 'mentor-review-6': return <S_MentorReviewStub n={6} step={6} prevRoute="reconciliation" nextRoute="report-writing" {...p} />;
    case 'report-writing': return <S_ReportWriting {...p} />;
    case 'uspap-checklist': return <S_USPAPChecklistScreen {...p} />;
    case 'mentor-review-7': return <S_MentorReviewStub n={7} step={7} prevRoute="report-writing" nextRoute="capstone" {...p} />;
    case 'mentor-review-8': return <S_MentorReviewStub n={8} step={8} prevRoute="capstone" nextRoute={null} {...p} />;
    case 'capstone': return <S_Capstone {...p} />;
    case 'mentors-corner': return <S_MentorsCorner {...p} />;
    case 'office-hours': return <S_OfficeHours {...p} />;
    case 'workfile': return <S30b_Workfile {...p} />;
    default: return <S03_Dashboard {...p} />;
  }
}

// ─── Root App ─────────────────────────────────────────────────────
function App() {
  const [route, setRoute] = useState(() => {
    try {
      const acked = JSON.parse(localStorage.getItem('parea_acknowledged_preamble_v1') || '{}');
      const pts = ['ai-not-human','human-value','tools-are-tools','verify-credibility','workfile-evidence'];
      return pts.every(k => acked[k]) ? 'home' : 'before-you-start';
    } catch(e) { return 'before-you-start'; }
  });
  const [sidebarCollapsed, setSidebarCollapsed] = useState(true);
  const [aiOpen, setAiOpen] = useState(false);
  const [textbookTopic, setTextbookTopic] = useState(null);
  const [tweaks] = useState({ aiIntensity: 'normal', uspapStrict: 'normal', showCohortFeed: true });

  const navigate = r => setRoute(r);
  window.__openTextbook = setTextbookTopic;

  return (
    <div style={{ display: 'flex', height: '100vh', overflow: 'hidden', background: '#f4f5f7', fontFamily: "'DM Sans', system-ui, sans-serif" }}>
      <PAREASidebar active={route} onNav={navigate} collapsed={sidebarCollapsed} />
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden', marginRight: aiOpen ? 320 : 0, transition: 'margin-right 250ms ease' }}>
        <TopBar onMenuToggle={() => setSidebarCollapsed(c => !c)} collapsed={sidebarCollapsed} />
        <div style={{ flex: 1, overflow: 'auto', padding: '24px 28px 80px' }}>
          {renderScreen(route, navigate, tweaks)}
        </div>
      </div>
      <SocraticPanel open={aiOpen} onToggle={() => setAiOpen(o => !o)} route={route} />
      {textbookTopic && <TextbookModal topic={textbookTopic} onClose={() => setTextbookTopic(null)} />}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

  </script>
</body>
