<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>McKissock PAREA Program</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { corePlugins: { preflight: false } }</script>
    <style>
      body { font-family: 'DM Sans', system-ui, sans-serif; }
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #d0d0d0; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #b0b0b0; }
      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50%       { opacity: 0.4; }
      }
      @keyframes attentionShake {
        0%, 100% { transform: translateX(0); }
        10%, 30%, 50% { transform: translateX(-3px); }
        20%, 40%, 60% { transform: translateX(3px); }
        70% { transform: translateX(0); }
      }
      .screen-enter { animation: fadeInUp 220ms cubic-bezier(0.4,0,0.2,1) both; }
      .socratic-attention { animation: attentionShake 700ms cubic-bezier(0.36,0.07,0.19,0.97) both; }
      @media (prefers-reduced-motion: reduce) {
        .screen-enter, .socratic-attention { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
